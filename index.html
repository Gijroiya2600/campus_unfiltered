<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- NAYA: Browser Tab ka naam change kiya -->
    <title>Osgu Campus Confession</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b; --card-bg: #18181b; --primary: #8b5cf6;
            --text-main: #f3f4f6; --text-muted: #9ca3af; --border-color: #27272a;
            --downvote: #ef4444; --notif-badge: #ef4444; --whatsapp: #25D366;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; line-height: 1.5; padding-bottom: 70px; overscroll-behavior-y: contain; 
        }
        #ptr-spinner { text-align: center; padding: 15px; color: var(--primary); font-size: 1.5rem; display: none; background: var(--bg-color); }
        header {
            position: sticky; top: 0; background-color: rgba(9, 9, 11, 0.85); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); padding: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 50;
        }
        header h1 { font-size: 1.25rem; font-weight: bold; margin: 0; color: white; display: flex; align-items: center; }
        .header-icons { display: flex; gap: 20px; align-items: center; }
        .bell-wrapper { position: relative; cursor: pointer; }
        .bell-icon { color: var(--text-muted); font-size: 1.25rem; transition: color 0.2s; }
        .bell-wrapper:hover .bell-icon { color: var(--text-main); }
        .notif-badge {
            position: absolute; top: -5px; right: -6px; background-color: var(--notif-badge);
            color: white; font-size: 0.65rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center;
        }
        .notif-dropdown {
            display: none; position: absolute; top: 65px; right: 16px; background-color: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; width: 250px; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); z-index: 100;
        }
        .notif-header { padding: 12px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 0.9rem; }
        .notif-list { padding: 0; margin: 0; }
        .notif-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: #d1d5db; }
        .notif-item i { margin-right: 8px; color: var(--primary); }
        .search-container { display: none; background-color: var(--bg-color); padding: 10px 16px; border-bottom: 1px solid var(--border-color); position: sticky; top: 61px; z-index: 40; }
        .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 9999px; padding: 8px 16px; }
        .search-box i { color: var(--text-muted); margin-right: 10px; }
        .search-box input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 0.95rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .feed-filters { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 9999px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .user-block { display: flex; align-items: center; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-right: 12px; color: var(--primary); }
        .user-info h3 { margin: 0; font-size: 0.9rem; font-weight: 600; color: white; }
        .user-info p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }
        .report-btn { color: var(--text-muted); background: none; border: none; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .report-btn:hover { color: var(--downvote); }
        .feed-text { margin: 0 0 16px 0; color: #d1d5db; line-height: 1.6; word-wrap: break-word; }
        .hashtag { color: var(--primary); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .hashtag:hover { text-decoration: underline; }
        .feed-stats { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; color: var(--text-muted); font-size: 0.9rem; }
        .stat-group { display: flex; gap: 20px; }
        .feed-stats div { cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .feed-stats i { margin-right: 6px; }
        .share-btn:hover { color: var(--whatsapp); }
        .comments-section { display: none; border-top: 1px solid var(--border-color); margin-top: 12px; padding-top: 12px; }
        .comment-input-area { display: flex; gap: 8px; margin-bottom: 12px; }
        .comment-input-area input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: white; padding: 8px 12px; border-radius: 9999px; font-size: 0.9rem; outline: none; }
        .comment-btn { background-color: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 9999px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .comment-item { background: rgba(255, 255, 255, 0.03); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; color: #d1d5db; }
        .comment-meta { font-size: 0.75rem; color: var(--primary); margin-bottom: 4px; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background-color: rgba(9, 9, 11, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 12px 0; z-index: 50; }
        .nav-item { color: var(--text-muted); font-size: 1.5rem; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
        .nav-item:hover { color: var(--text-main); transform: scale(1.1); }
        .nav-item.active { color: var(--primary); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 90%; max-width: 500px; padding: 20px; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .modal-header h2 { margin: 0; font-size: 1.1rem; color: white; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: var(--downvote); }
        .modal-content textarea { width: 100%; background: transparent; color: var(--text-main); border: none; outline: none; resize: none; font-size: 1.1rem; font-family: inherit; margin-bottom: 10px; }
        .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 8px; }
        .action-icons button { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; margin-right: 16px; cursor: pointer; }
        .action-icons button:hover { color: var(--primary); }
        .post-btn { background-color: var(--primary); color: white; border: none; padding: 8px 24px; border-radius: 9999px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        
        .image-preview-container { position: relative; display: none; margin-bottom: 15px; }
        .image-preview-container img { width: 100%; border-radius: 12px; max-height: 400px; object-fit: contain; background: #000; }
        .remove-image-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .feed-img {
            width: 100%; border-radius: 12px; margin-bottom: 12px;
            transform-origin: center center;
            transition: transform 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div id="ptr-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Refreshing...</div>

    <header>
        <div style="max-width: 600px; width: 100%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <!-- NAYA: Main Header naam change kiya -->
            <h1><i class="fa-solid fa-mask" style="color: var(--primary); margin-right: 10px;"></i> Osgu Campus Confession</h1>
            <div class="header-icons">
                <div class="bell-wrapper" onclick="window.toggleNotifications()">
                    <i class="fa-solid fa-bell bell-icon"></i>
                    <div id="notifBadge" class="notif-badge">0</div>
                </div>
            </div>
        </div>
    </header>

    <div id="searchContainer" class="search-container">
        <div class="search-box" style="max-width: 600px; margin: 0 auto;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search confessions or #hashtags..." onkeyup="window.searchPosts()">
        </div>
    </div>

    <div id="notifDropdown" class="notif-dropdown">
        <div class="notif-header">Notifications</div>
        <div id="notifList" class="notif-list"><div class="notif-item text-muted" id="emptyNotif">No new notifications</div></div>
    </div>

    <div id="postModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Confession</h2>
                <button class="close-btn" onclick="window.closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="confessionInput" rows="4" placeholder="Spill the tea... use #hashtags!"></textarea>
            
            <input type="file" id="mediaUpload" style="display: none;" accept="image/*" onchange="window.handleImageSelect(event)">
            <div id="imagePreviewContainer" class="image-preview-container">
                <img id="imagePreview" src="">
                <button class="remove-image-btn" onclick="window.removeImage()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="post-actions">
                <div class="action-icons">
                    <button onclick="document.getElementById('mediaUpload').click()"><i class="fa-regular fa-image"></i></button>
                    <button onclick="alert('Polls coming soon!')"><i class="fa-solid fa-chart-simple"></i></button>
                </div>
                <button class="post-btn" id="submitPostBtn" onclick="window.postConfession()">Whisper It <i class="fa-regular fa-paper-plane" style="margin-left:5px;"></i></button>
            </div>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Report Confession</h2>
                <button class="close-btn" onclick="window.closeReportModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="margin-bottom: 15px; color: var(--text-muted); font-size: 0.9rem;">Why are you reporting this post?</p>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;"><input type="radio" name="reportReason" value="spam"> Spam or Misleading</label>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;"><input type="radio" name="reportReason" value="harassment"> Bullying or Harassment</label>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;"><input type="radio" name="reportReason" value="hate"> Hate Speech</label>
            </div>
            <button class="post-btn" style="width: 100%; background-color: var(--downvote);" onclick="window.submitReport()">Submit Report</button>
        </div>
    </div>

    <div class="container">
        <div class="feed-filters">
            <button class="filter-btn active" id="latestBtn" onclick="window.sortFeed('latest')">Latest</button>
            <button class="filter-btn" id="trendingBtn" onclick="window.sortFeed('trending')">Trending 🔥</button>
        </div>
        <div id="feed">
            <div style="text-align:center; padding: 20px; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading confessions from database...</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="window.scrollToTop()"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="window.toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="window.openModal()" style="color: var(--primary); transform: scale(1.15);"><i class="fa-solid fa-square-plus"></i></div>
        <div class="nav-item" onclick="alert('Anonymous Profile coming soon!')"><i class="fa-regular fa-user"></i></div>
    </nav>

    <!-- FIREBASE AND JAVASCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, doc, updateDoc, arrayUnion, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjXcIiY_4T6VNNGK9D95PouHfrbbGuUvA",
            authDomain: "unfiltered-campus.firebaseapp.com",
            projectId: "unfiltered-campus",
            storageBucket: "unfiltered-campus.firebasestorage.app",
            messagingSenderId: "1077308233975",
            appId: "1:1077308233975:web:f8c9b881aec07b83b41bf2",
            measurementId: "G-QKJNL3H4MJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allPosts = [];
        window.currentSort = 'latest';
        let unreadNotifications = 0;
        let postToReport = null;
        window.currentImageBase64 = null;

        const q = query(collection(db, "confessions"), orderBy("timestamp", "desc"), limit(15));
        
        onSnapshot(q, (snapshot) => {
            window.allPosts = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                data.id = docSnap.id;
                window.allPosts.push(data);
            });
            window.renderFeed(); 
        });

        window.renderFeed = function() {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            let displayPosts = [...window.allPosts];
            
            let myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
            let upvoted = JSON.parse(localStorage.getItem('upvoted') || '[]');
            let downvoted = JSON.parse(localStorage.getItem('downvoted') || '[]');
            
            if (window.currentSort === 'trending') displayPosts.sort((a, b) => b.upvotes - a.upvotes); 

            if (displayPosts.length === 0) {
                feed.innerHTML = '<div style="text-align:center; padding: 20px; color: #9ca3af;">Be the first to confess something!</div>';
                return;
            }

            displayPosts.forEach(data => {
                if (searchQuery && !data.text.toLowerCase().includes(searchQuery)) return;

                const diff = Date.now() - data.timestamp;
                const mins = Math.floor(diff / 60000);
                let timeStr = "Just now";
                if(mins >= 60 && mins < 1440) timeStr = Math.floor(mins/60) + " hours ago";
                else if (mins >= 1440) timeStr = Math.floor(mins/1440) + " days ago";
                else if (mins > 0) timeStr = mins + " mins ago";

                let commentsHTML = "";
                if(data.comments) {
                    data.comments.forEach(c => {
                        commentsHTML += `<div class="comment-item"><div class="comment-meta">Anonymous 👻</div>${c}</div>`;
                    });
                }

                const imageHTML = data.imageUrl ? `<img src="${data.imageUrl}" class="feed-img" ontouchstart="window.startPinch(event, this)" ontouchmove="window.movePinch(event, this)" ontouchend="window.endPinch(event, this)">` : '';

                const isMyPost = myPosts.includes(data.id);
                const deleteBtnHTML = isMyPost ? `<button class="report-btn" style="color: #ef4444; margin-right: 12px;" onclick="window.deletePost('${data.id}')"><i class="fa-solid fa-trash"></i></button>` : '';

                const isUpvoted = upvoted.includes(data.id);
                const isDownvoted = downvoted.includes(data.id);
                const upColor = isUpvoted ? 'var(--primary)' : 'inherit';
                const downColor = isDownvoted ? 'var(--downvote)' : 'inherit';

                feed.insertAdjacentHTML('beforeend', `
                <div class="card post-item" id="${data.id}">
                    <div class="feed-header">
                        <div class="user-block">
                            <div class="avatar">👻</div>
                            <div class="user-info">
                                <h3>Anonymous Student</h3>
                                <p>${timeStr}</p>
                            </div>
                        </div>
                        <div>
                            ${deleteBtnHTML}
                            <button class="report-btn" onclick="window.reportPost('${data.id}')"><i class="fa-regular fa-flag"></i></button>
                        </div>
                    </div>
                    ${imageHTML}
                    <p class="feed-text raw-text">${data.text}</p>
                    <div class="feed-stats">
                        <div class="stat-group">
                            <div onclick="window.vote('${data.id}', 1)" class="upvote-btn" style="color: ${upColor};"><i class="fa-solid fa-arrow-up"></i> <span class="vote-count">${data.upvotes}</span></div>
                            <div onclick="window.vote('${data.id}', -1)" style="color: ${downColor};"><i class="fa-solid fa-arrow-down"></i> <span>${data.downvotes}</span></div>
                            <div onclick="window.toggleComments('${data.id}')"><i class="fa-regular fa-comment"></i> <span>${data.comments ? data.comments.length : 0}</span></div>
                        </div>
                        <div class="share-btn" onclick="window.shareToWhatsApp('${encodeURIComponent(data.text)}')"><i class="fa-brands fa-whatsapp"></i></div>
                    </div>
                    <div class="comments-section" id="comments-${data.id}">
                        <div class="comment-input-area">
                            <input type="text" id="commentInput-${data.id}" placeholder="Add a comment...">
                            <button class="comment-btn" onclick="window.addComment('${data.id}')">Reply</button>
                        </div>
                        <div class="comments-list">${commentsHTML}</div>
                    </div>
                </div>
                `);
            });
        };

        window.vote = async function(postId, voteType) {
            let upvoted = JSON.parse(localStorage.getItem('upvoted') || '[]');
            let downvoted = JSON.parse(localStorage.getItem('downvoted') || '[]');
            const postRef = doc(db, "confessions", postId);
            let updates = {};

            if (voteType === 1) { 
                if (upvoted.includes(postId)) {
                    updates.upvotes = increment(-1);
                    upvoted = upvoted.filter(id => id !== postId);
                } else {
                    updates.upvotes = increment(1);
                    upvoted.push(postId);
                    if (downvoted.includes(postId)) {
                        updates.downvotes = increment(-1);
                        downvoted = downvoted.filter(id => id !== postId);
                    }
                }
            } else { 
                if (downvoted.includes(postId)) {
                    updates.downvotes = increment(-1);
                    downvoted = downvoted.filter(id => id !== postId);
                } else {
                    updates.downvotes = increment(1);
                    downvoted.push(postId);
                    if (upvoted.includes(postId)) {
                        updates.upvotes = increment(-1);
                        upvoted = upvoted.filter(id => id !== postId);
                    }
                }
            }

            localStorage.setItem('upvoted', JSON.stringify(upvoted));
            localStorage.setItem('downvoted', JSON.stringify(downvoted));

            window.renderFeed();

            if (Object.keys(updates).length > 0) {
                await updateDoc(postRef, updates);
            }
        };

        window.deletePost = async function(postId) {
            if(confirm("Are you sure you want to delete this confession?")) {
                try {
                    await deleteDoc(doc(db, "confessions", postId));
                    window.createNotification("Post deleted successfully!", "fa-trash");
                    
                    let myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
                    myPosts = myPosts.filter(id => id !== postId);
                    localStorage.setItem('myPosts', JSON.stringify(myPosts));
                } catch(e) {
                    alert("Error deleting post. Make sure you have internet.");
                }
            }
        };

        window.initialPinchDistance = null;

        window.startPinch = function(e, img) {
            if (e.touches.length === 2) {
                img.style.transition = 'none'; 
                img.style.position = 'relative';
                img.style.zIndex = '100'; 
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                window.initialPinchDistance = Math.hypot(dx, dy);
            }
        };

        window.movePinch = function(e, img) {
            if (e.touches.length === 2 && window.initialPinchDistance) {
                e.preventDefault(); 
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDistance = Math.hypot(dx, dy);
                const scale = currentDistance / window.initialPinchDistance;
                
                if (scale >= 1 && scale <= 4) {
                    img.style.transform = `scale(${scale})`;
                }
            }
        };

        window.endPinch = function(e, img) {
            window.initialPinchDistance = null;
            img.style.transition = 'transform 0.3s ease-out'; 
            img.style.transform = 'scale(1)'; 
            
            setTimeout(() => {
                img.style.position = 'static';
                img.style.zIndex = 'auto';
            }, 300);
        };

        window.handleImageSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200; 
                    const scaleSize = MAX_WIDTH / img.width;
                    
                    if(img.width > MAX_WIDTH) {
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    window.currentImageBase64 = canvas.toDataURL('image/jpeg', 0.85); 
                    
                    if (window.currentImageBase64.length > 950000) {
                        alert("Yeh photo abhi bhi 1MB limit se badi hai. Kripya thodi kam detail wali photo chunein (Database limit).");
                        window.removeImage();
                        return;
                    }

                    document.getElementById('imagePreview').src = window.currentImageBase64;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

        window.removeImage = function() {
            window.currentImageBase64 = null;
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('mediaUpload').value = ""; 
        };

        window.postConfession = async function() {
            const input = document.getElementById('confessionInput');
            const btn = document.getElementById('submitPostBtn');
            let text = input.value;
            
            if (text.trim() === "" && !window.currentImageBase64) return;

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Posting...';
            btn.disabled = true;

            const formattedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;") 
                                      .replace(/(^|\s)(#[a-z\d-]+)/ig, "$1<span class='hashtag' onclick=\"window.searchHashtag('$2')\">$2</span>");

            try {
                const docRef = await addDoc(collection(db, "confessions"), {
                    text: formattedText,
                    imageUrl: window.currentImageBase64, 
                    upvotes: 0,
                    downvotes: 0,
                    comments: [],
                    timestamp: Date.now()
                });
                
                let myPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
                myPosts.push(docRef.id);
                localStorage.setItem('myPosts', JSON.stringify(myPosts));

                input.value = "";
                window.removeImage(); 
                window.closeModal();
                document.getElementById('latestBtn').click(); 
                window.createNotification("Confession posted live!", "fa-check");
            } catch (e) {
                alert("Image size is still too large for the database. Please try a smaller photo.");
                console.error(e);
            }
            
            btn.innerHTML = 'Whisper It <i class="fa-regular fa-paper-plane" style="margin-left:5px;"></i>';
            btn.disabled = false;
        };

        window.addComment = async function(postId) {
            const input = document.getElementById('commentInput-' + postId);
            const text = input.value;
            if (text.trim() === "") return;
            const formattedComment = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const postRef = doc(db, "confessions", postId);
            await updateDoc(postRef, { comments: arrayUnion(formattedComment) });
            input.value = ""; 
            window.createNotification("Comment posted live!", "fa-comment");
        };

        window.sortFeed = function(type) {
            document.getElementById('latestBtn').classList.remove('active');
            document.getElementById('trendingBtn').classList.remove('active');
            document.getElementById(type + 'Btn').classList.add('active');
            window.currentSort = type;
            window.renderFeed();
        };

        window.searchHashtag = function(tag) {
            document.getElementById('searchContainer').style.display = 'block';
            document.getElementById('searchInput').value = tag;
            window.scrollToTop();
            window.searchPosts(); 
        };

        window.toggleSearch = function() {
            const searchContainer = document.getElementById('searchContainer');
            if (searchContainer.style.display === 'block') {
                searchContainer.style.display = 'none';
                document.getElementById('searchInput').value = ''; 
                window.searchPosts(); 
            } else {
                searchContainer.style.display = 'block';
                document.getElementById('searchInput').focus();
                window.scrollToTop(); 
            }
        };

        window.searchPosts = function() { window.renderFeed(); };
        
        window.openModal = function() { 
            document.getElementById('postModal').style.display = 'flex'; 
            document.getElementById('confessionInput').focus(); 
        };
        
        window.closeModal = function() { 
            document.getElementById('postModal').style.display = 'none'; 
            window.removeImage(); 
        };
        
        window.scrollToTop = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };

        window.toggleNotifications = function() {
            const dropdown = document.getElementById('notifDropdown');
            const badge = document.getElementById('notifBadge');
            if (dropdown.style.display === 'block') { dropdown.style.display = 'none'; } 
            else { dropdown.style.display = 'block'; unreadNotifications = 0; badge.style.display = 'none'; }
        };

        window.createNotification = function(message, iconName) {
            const list = document.getElementById('notifList');
            const emptyMsg = document.getElementById('emptyNotif');
            const badge = document.getElementById('notifBadge');
            if (emptyMsg) emptyMsg.remove();
            list.insertAdjacentHTML('afterbegin', `<div class="notif-item"><i class="fa-solid ${iconName}"></i> ${message}</div>`);
            unreadNotifications++;
            badge.innerText = unreadNotifications;
            badge.style.display = 'flex';
        };

        window.toggleComments = function(postId) {
            const section = document.getElementById('comments-' + postId);
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
        };

        // NAYA: WhatsApp share text ka naam change kiya
        window.shareToWhatsApp = function(encodedText) {
            const shareText = `Check out this confession on Osgu Campus Confession: \n\n"${decodeURIComponent(encodedText)}"\n\nDownload the app to reply!`;
            window.location.href = `whatsapp://send?text=${shareText}`;
        };

        window.reportPost = function(id) { postToReport = id; document.getElementById('reportModal').style.display = 'flex'; };
        window.closeReportModal = function() { document.getElementById('reportModal').style.display = 'none'; postToReport = null; };

        window.submitReport = function() {
            const reasons = document.getElementsByName('reportReason');
            let selectedReason = false;
            for(let i=0; i<reasons.length; i++) { if(reasons[i].checked) { selectedReason = true; reasons[i].checked = false; break; } }
            if(!selectedReason) { window.createNotification("Select a reason first", "fa-circle-exclamation"); return; }
            if(postToReport) { document.getElementById(postToReport).style.display = 'none'; }
            window.closeReportModal(); 
            window.createNotification("Report submitted & hidden.", "fa-shield-halved");
        };

        let touchstartY = 0; let touchendY = 0;
        document.body.addEventListener('touchstart', e => { if (window.scrollY === 0) touchstartY = e.changedTouches[0].screenY; });
        document.body.addEventListener('touchend', e => {
            if (window.scrollY === 0) {
                touchendY = e.changedTouches[0].screenY;
                if (touchendY - touchstartY > 150) { 
                    document.getElementById('ptr-spinner').style.display = 'block';
                    setTimeout(() => location.reload(), 1000); 
                }
            }
        });
    </script>
</body>
</html>
